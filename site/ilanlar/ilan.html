        </a>
        <span class="pager__count" data-pager-count></span>
        <a class="pager__link pager__link--next" href="#" data-pager-next>

      <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSe0hUSZhEDcGFTGW6aIloQLaK3-xoV6OHq0TkETuLF_aRsZkA/viewform?usp=pp_url" data-form-link target="_blank" rel="noopener">Sahiplenme formunu doldur <span aria-hidden="true">↗</span></a>
    </div>
  </div>
</section>

<section class="section section--warm section--tight" data-others hidden>
  <div class="container">
    <div class="others__head">
      <h2 class="others__title" data-others-title>Diğer yuva arayanlar</h2>
      <a class="link-arrow" href="kopekler.html" data-others-all>Tümünü gör <span aria-hidden="true">→</span></a>
