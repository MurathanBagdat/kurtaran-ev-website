<body>
<a class="visually-hidden" href="#icerik">Skip to content</a>

  <header class="embed-bar">
    <div class="container embed-bar__inner">
      <span class="embed-bar__brand"><img src="../../assets/img/logo.png" alt="Kurtaran Ev" width="44" height="44">
        <span class="embed-bar__title" data-embed-title></span></span>
      <a class="embed-bar__close" href="https://en.kurtaranev.org/sahiplendirme" data-kapat aria-label="Close and return to the Kurtaran Ev website">
        <span class="embed-bar__close-text">Back to site</span><span class="embed-bar__x" aria-hidden="true">✕</span></a>
    </div>
  </header>
<main id="icerik">
<section class="section section--cream" style="padding-top:40px;padding-bottom:56px">
  <div class="container">
    <div class="detail-top">
      <p class="breadcrumb"><a href="kopekler" data-back-link>All listings</a></p>

      <nav class="pager" aria-label="Browse listings" data-pager hidden>
        <a class="pager__link" href="#" data-pager-prev>
          <span class="pager__arrow" aria-hidden="true">←</span>
          <span class="pager__text"><span class="pager__label">Previous</span><span class="pager__name"></span></span>
        </a>
        <span class="pager__count" data-pager-count></span>
        <a class="pager__link pager__link--next" href="#" data-pager-next>
          <span class="pager__text"><span class="pager__label">Next</span><span class="pager__name"></span></span>
          <span class="pager__arrow" aria-hidden="true">→</span>
        </a>
      </nav>
    </div>

    <div class="animal-detail" data-animal-detail></div>
  </div>
</section>

<section class="section section--cream meet-band" data-meet-band hidden>
  <div class="container">
    <div class="callout meet-cta">
      <h2 class="callout__title" data-meet-title></h2>
      <p class="callout__text">Fill in our adoption form and mention the name of the animal you are interested in. Our volunteers will contact you on WhatsApp.</p>
    </div>

    <p class="animal-detail__source meet-band__source" data-meet-source hidden></p>

    <div class="meet-band__cta">
      <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSdUIcBuv3YeGyWFCpXXa6RkgcGrL06tz0GxlFnyQGwluMHXcQ/viewform?usp=pp_url" data-form-link target="_blank" rel="noopener">Fill in the adoption form <span aria-hidden="true">↗</span></a>
    </div>
  </div>
</section>

<section class="section section--warm section--tight" data-others hidden>
  <div class="container">
    <div class="others__head">
      <h2 class="others__title" data-others-title>Others looking for a home</h2>
      <a class="link-arrow" href="kopekler" data-others-all>See all <span aria-hidden="true">→</span></a>
    </div>
    <div class="animal-grid" data-others-grid></div>
  </div>
</section>
</main>
