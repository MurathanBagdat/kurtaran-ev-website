# Kurtaran Ev — otomatik Instagram senkronu + GitHub Pages yayını
#
# Ne yapar?
#   1. Her gün TSİ 17:00'de (14:00 UTC) iki Instagram hesabının son
#      gönderilerini çeker, yeni ilanları AI ile ayrıştırıp siteye ekler
#      ve değişiklikleri repo'ya commit'ler.
#   2. site/ klasörünü GitHub Pages'e yayınlar — böylece yeni veri
#      lokalde hiçbir şey çalıştırmadan canlı sitede görünür.
#
# Kota notu: RapidAPI planı günde 400 istek verir; tools/rapidapi_kota.py
# kendi sınırımızı (günde 350) uygular ve sınır dolunca istek göndermez.
# Kullanım tools/rapidapi_kota.json'da tutulur ve her çalıştırmada
# commit'lenir. Hesap başına son 20 gönderi (2 sayfa) → çalıştırma başına ~4 istek.
# Ardından yuvalanma kontrolü (tools/yuvalanma_kontrol.py): yuva arayan
# ilanların caption'larında "YUVALANDI" aranır; kendi alt bütçesi günde 200.
#
# Elle tetikleme: GitHub > Actions > bu workflow > "Run workflow".
# Lokal düzenlemeler main'e push'lanınca da site yeniden yayınlanır.

name: instagram-sync

on:
  schedule:
    - cron: "0 14 * * *" # 17:00 Türkiye saati (UTC+3, yaz/kış değişmez)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write # senkron raporu issue yorumu olarak gider → e-posta bildirimi

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    # push tetiklemesinde senkron atlanır; yalnızca site yeniden yayınlanır
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instagram senkronu
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SYNC_RAPOR: sync_rapor.md
        run: python3 tools/instagram_sync.py --rapid --limit 20

      # Rapor her çalıştırmada oluşur (yeni ilan yoksa da): günlük RapidAPI
      # kota kullanımı her gün mailde görünür.
      - name: Raporu e-postala (Gmail SMTP)
        if: ${{ always() && hashFiles('sync_rapor.md') != '' }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          cat sync_rapor.md >> "$GITHUB_STEP_SUMMARY"
          python3 tools/notify_mail.py sync_rapor.md
          rm -f sync_rapor.md

      # always(): senkron hata verse de kota sayacı kaybolmasın
      - name: Değişiklik varsa commit'le
        if: ${{ always() }}
        run: |
          git config user.name "kurtaranev-bot"
          git config user.email "actions@github.com"
          git add site/assets/data site/assets/img/animals tools/gorulen_gonderiler.json
          git add tools/rapidapi_kota.json tools/yuvalanma_kontrol.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit gerekmedi."
          else
            if git diff --cached --quiet -- site tools/gorulen_gonderiler.json; then
              git commit -m "RapidAPI kota kaydı ($(date -u +%Y-%m-%d))"
            else
              git commit -m "Instagram senkronu: ilanlar güncellendi ($(date -u +%Y-%m-%d))"
            fi
            git push
          fi

  deploy:
    # sync atlansa da (push tetiklemesi) çalışsın; sync başarısızsa çalışmasın
    needs: sync
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # sync'in az önce push'ladığı commit dahil en güncel hâl
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
